{% extends "base.html" %}
{% from "_macros.html" import tech_badges with context %}

{% block content %}
<section class="animate-fade-up pt-16 sm:pt-20">
    <div class="flex items-center gap-5">
        <img src="{{ url_for('static', filename=profile_img) }}" alt="{{ title }}"
             class="h-16 w-16 rounded-full object-cover ring-2 ring-zinc-800 sm:h-20 sm:w-20">
        <div>
            <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">{{ title }}</h1>
            <p class="mt-1 text-zinc-400">{{ tagline }}</p>
        </div>
    </div>
</section>

<section class="animate-fade-up mt-8 text-sm leading-relaxed text-zinc-400 [animation-delay:80ms]">
    <p>{{ about_intro }}</p>
    <ul class="mt-1.5 list-disc space-y-1 pl-5 marker:text-zinc-600">
        {% for point in about_points %}
        <li>{{ point }}</li>
        {% endfor %}
    </ul>
</section>

<section class="animate-fade-up mt-8 flex flex-wrap items-center justify-between gap-3 [animation-delay:120ms]">
    <div class="flex flex-wrap gap-3">
        <a href="/experience"
           class="rounded-full bg-zinc-100 px-4 py-2 text-sm font-medium text-zinc-900 transition-colors hover:bg-white">View Experience</a>
        <a href="/projects"
           class="rounded-full border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-200 transition-colors hover:border-zinc-600 hover:bg-zinc-900">View Projects</a>
    </div>
    <div class="flex items-center gap-3">
        <a href="{{ github_url }}" target="_blank" rel="noopener" aria-label="GitHub"
           class="text-zinc-500 transition-colors hover:text-white">
            <svg viewBox="0 0 16 16" fill="currentColor" class="h-5 w-5" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
            </svg>
        </a>
        <a href="{{ linkedin_url }}" target="_blank" rel="noopener" aria-label="LinkedIn"
           class="text-zinc-500 transition-colors hover:text-white">
            <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
                <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45Z"/>
            </svg>
        </a>
    </div>
</section>
{% endblock %}
