{% extends "base.html" %}

{% block content %}
<section class="animate-fade-up pt-16 sm:pt-20">
    <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Travel</h1>
    <p class="mt-2 text-zinc-400">Places I've visited.</p>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<div id="travel-map"
     class="animate-fade-up mt-10 h-[480px] w-full overflow-hidden rounded-xl border border-zinc-800 [animation-delay:120ms]"></div>

<script>
    const visited = {{ visited | tojson }};
    const map = L.map('travel-map', { scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 18,
    }).addTo(map);

    if (visited.length) {
        const markers = visited.map(p => L.marker([p.lat, p.lng]).addTo(map).bindPopup(p.name));
        map.fitBounds(L.featureGroup(markers).getBounds().pad(0.3));
    } else {
        map.setView([20, 0], 2);
    }
</script>
{% endblock %}
